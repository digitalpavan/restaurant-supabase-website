<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Dhanvika</title>
  <meta name="description" content="Sign in to your Dhanvika account with email, Google or Facebook.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">
  <header class="auth-header">
    <div class="container auth-header-inner">
      <a href="index.html" class="logo">Dhanvika<span>.</span></a>
      <a href="index.html" class="muted auth-back">&larr; Back to website</a>
    </div>
  </header>

  <main class="container auth-main">
    <p id="auth-loading" class="menu-status">Loading&hellip;</p>

    <!-- Signed out: sign in / create account -->
    <section id="auth-view" class="auth-card" hidden>
      <p class="eyebrow">Welcome</p>
      <h1 id="auth-title" class="auth-title">Sign in</h1>

      <div class="social-buttons">
        <button type="button" class="social-btn" data-provider="google">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Continue with Google
        </button>
        <button type="button" class="social-btn" data-provider="facebook">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4h-3V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>
          Continue with Facebook
        </button>
      </div>

      <div class="auth-divider"><span>or use your email</span></div>

      <form id="auth-form" class="form" novalidate>
        <label id="name-field" hidden>Full name
          <input type="text" name="full_name" maxlength="100" autocomplete="name">
        </label>
        <label>Email
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label id="password-field">Password
          <input type="password" name="password" required minlength="6" autocomplete="current-password">
        </label>
        <button type="button" id="forgot-link" class="text-btn">Forgot password?</button>
        <button type="submit" class="btn" id="auth-submit">Sign in</button>
        <p id="auth-message" class="form-message" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-switch">
        <span id="switch-text">New to Dhanvika?</span>
        <button type="button" id="switch-mode" class="text-btn">Create an account</button>
      </p>
    </section>

    <!-- Arrived from a password-reset email -->
    <section id="reset-view" class="auth-card" hidden>
      <p class="eyebrow">Account</p>
      <h1 class="auth-title">Set a new password</h1>
      <form id="reset-form" class="form" novalidate>
        <label>New password
          <input type="password" name="password" required minlength="6" autocomplete="new-password">
        </label>
        <button type="submit" class="btn">Save password</button>
        <p id="reset-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <!-- Signed in -->
    <section id="account-view" class="auth-card" hidden>
      <p class="eyebrow">My account</p>
      <h1 class="auth-title">Hello, <span id="account-name"></span></h1>
      <p class="muted">Signed in as <strong id="account-email"></strong> <span id="account-provider"></span></p>
      <div class="account-actions">
        <a href="index.html#reservation" class="btn">Reserve a table</a>
        <a href="index.html#menu-section" class="btn btn-outline">View menu</a>
      </div>
      <button type="button" id="sign-out" class="text-btn">Sign out</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
